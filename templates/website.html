<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filtering Website</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }

        h1, h2, h3 {
            margin: 0;
        }

        /* Header */
        header {
            background-color: #900;
            color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        header img {
            height: 80px;
            width: auto;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-left: 30px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        nav ul li a:hover {
            color: #e3e3e3;
        }

        /* Hero Section */
        .hero {
            background: url('https://www.uark.edu/_resources/images/campus-trees.jpg') no-repeat center center/cover;
            height: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: rgb(162, 6, 6);
            padding: 0 20px;
            background-size: cover;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
        }

        .hero h2 {
            font-size: 36px;
            max-width: 800px;
            margin: 0;
            color: rgb(162, 6, 6);
            font-weight: 700;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
        }

        .hero a {
            color: rgb(162, 6, 6);;
            text-decoration: underline;
        }

        .hero a:hover {
            color: rgb(252, 252, 252);
        }

        /* Filter Section */
        .filter-section {
            padding: 50px 20px;
            text-align: center;
            background-color: #fff;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
            margin: -60px 20px 40px 20px;
            border-radius: 8px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }

        .filter-section h3 {
            margin-bottom: 30px;
            font-size: 28px;
            color: #333;
            font-weight: 600;
        }

        .filter-section select, .filter-section button {
            width: 250px;
            margin: 10px 0;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .filter-section select:focus, .filter-section button:focus {
            border-color: #900;
            outline: none;
            box-shadow: 0 0 10px rgba(144, 0, 0, 0.3);
        }

        .filter-section button {
            background-color: #900;
            color: #fff;
            cursor: pointer;
            border: none;
            font-weight: bold;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .filter-section button:hover {
            background-color: #700;
            transform: scale(1.05);
        }

        .filter-section button:active {
            transform: scale(1.02);
        }

        /* Footer */
        footer {
            background-color: #900;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            margin-top: 40px;
            font-size: 14px;
        }

        footer a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h2 {
                font-size: 26px;
                padding: 0 10px;
            }

            .filter-section {
                margin: 10px;
                padding: 30px;
            }

            .filter-section select,
            .filter-section button {
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <img src="{{ url_for('static', filename='logo.png') }}"/>


        </div>
    </header>

    <div class="hero">
        <h2>Welcome to the <a href="https://catalog.uark.edu/undergraduatecatalog/coursesofinstruction/bmeg/" target="_blank">BMEG 45903: Biomedical Innovations for Global Impact</a> need statement filtering database tool. Please select the desired filtering criteria.</h2>
    </div>

    <div class="filter-section">
        <h3>Filter Options</h3>
        <form action="/results" method="get">
            <select name="year" aria-label="Filter by year">
                <option value="" disabled selected>Filter by year</option>
                <option value="2011">2011</option>
                <option value="2012">2012</option>
                <option value="2013">2013</option>
                <option value="2014">2014</option>
                <option value="2015">2015</option>
                <option value="2016">2016</option>
                <option value="2023">2023</option>
            </select>
            <select name="location" aria-label="Filter by location">
                <option value="" disabled selected>Filter by location</option>
                <option value="india">India</option>
                <option value="china">China</option>
                <option value="ethiopia">Ethiopia</option>
                <option value="ghana">Ghana</option>
            </select>
            <select name="specialty" aria-label="Filter by medical specialty">
                <option value="" disabled selected>Filter by medical specialty</option>
                <option value="administration">Administration</option>
                <option value="cardiology">Cardiology</option>
                <option value="ergonomics_and_safety">Ergonomics and Safety</option>
                <option value="general">General</option>
                <option value="general_surgery">General Surgery</option>
                <option value="critical_care">Critical Care</option>
                <option value="infant_health">Infant Health</option>
                <option value="instrument_functionality">Instrument Functionality</option>
                <option value="maternal_health">Maternal Health</option>
                <option value="obstetrics_and_gynecology">Obstetrics and Gynecology</option>
                <option value="minimally_invasive_surgery">Minimally Invasive Surgery</option>
                <option value="neurosurgery">Neurosurgery</option>
                <option value="open_abdominal_surgery">Open Abdominal Surgery</option>
                <option value="operation_visibility">Operation Visibility</option>
                <option value="patient_comfort">Patient Comfort</option>
                <option value="patient_outcome">Patient Outcome</option>
                <option value="physical_medicine_and_rehabilitation">Physical Medicine and Rehabilitation</option>
                <option value="procedural_improvement">Procedural Improvement</option>
                <option value="procedural_time">Procedural Time</option>
                <option value="traffic_safety">Traffic Safety</option>
                <option value="training">Training</option>
                <option value="training_method">Training Method</option>
            </select>
            <button type="submit">Search</button>
        </form>
    </div>

</body>
</html>
